name: CI
on:
  push:
    branches: [main, 'phase/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  core-linux:
    name: Core tests (Swift 6.2, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CallCaptureCore
        run: swift test 2>&1 | tee core-linux-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-linux-tests, path: Packages/CallCaptureCore/core-linux-tests.log, retention-days: 7 }

  package-macos:
    name: Package tests + iOS SDK compile (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test (macOS host; media pipeline tests run in the iOS simulator app job)
        working-directory: Packages/CallCaptureCore
        timeout-minutes: 15
        run: |
          set -o pipefail
          # A pseudo-terminal keeps test output line-buffered so a stall is visible in the log.
          script -q /dev/null swift test 2>&1 | tee package-macos-tests.log
      - name: Compile package for iOS 27 device SDK (ScreenCaptureKit engine)
        working-directory: Packages/CallCaptureCore
        run: |
          xcodebuild -scheme CallCaptureCore-Package -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath /tmp/dd-pkg CODE_SIGNING_ALLOWED=NO build 2>&1 | tee package-ios-build.log | grep -E "error|warning: |BUILD" || true
          grep -q "BUILD SUCCEEDED" package-ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-macos-logs
          path: |
            Packages/CallCaptureCore/package-macos-tests.log
            Packages/CallCaptureCore/package-ios-build.log
          retention-days: 7

  app-ios:
    name: App — simulator tests + unsigned Release device build (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rt=[k for k in d if 'iOS-27' in k]
          devs=[x for k in rt for x in d[k] if x['name']=='iPhone 17 Pro'] or [x for k in rt for x in d[k] if 'iPhone' in x['name']]
          print(devs[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Debug simulator build + unit/UI tests
        run: |
          set -o pipefail
          xcodebuild test -project CallCapture.xcodeproj -scheme CallCapture -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult -derivedDataPath /tmp/dd-app CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|✔|✘|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" app-test.log
      - name: Small-screen layout run (UX02)
        if: always()
        run: |
          SMALL=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[x for k in d if 'iOS-27' in k for x in d[k] if 'iPhone' in x['name']]
          pref=['iPhone SE (3rd generation)','iPhone 13 mini','iPhone 16e','iPhone 17e','iPhone 16','iPhone 17']
          devs.sort(key=lambda x: pref.index(x['name']) if x['name'] in pref else 99)
          print(devs[0]['udid'], '|', devs[0]['name'])")
          echo "Small device: $SMALL"
          UDID=${SMALL%% |*}
          set -o pipefail
          xcodebuild test-without-building -project CallCapture.xcodeproj -scheme CallCapture             -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath /tmp/dd-app -resultBundlePath SmallScreen.xcresult             -only-testing:CallCaptureUITests/CallCaptureUITests/testRecordStopAndSave             -only-testing:CallCaptureUITests/CallCaptureUITests/testLargestTextDarkModeKeepsStop             -only-testing:CallCaptureUITests/CallCaptureUITests/testOnboardingAndSetup             2>&1 | tee small-screen.log | grep -E "Test Case .* (passed|failed)|error:|TEST (SUCCEEDED|FAILED)" || true
          mkdir -p screenshots-small && xcrun xcresulttool export attachments --path SmallScreen.xcresult --output-path screenshots-small || true
          grep -Eq "TEST (EXECUTE )?SUCCEEDED" small-screen.log
      - name: Unsigned Release build for iOS devices
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project CallCapture.xcodeproj -scheme CallCapture -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath /tmp/dd-release CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee release-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release-build.log
      - name: Release audit (no test doubles, plist, privacy manifest)
        if: always()
        run: bash scripts/release_audit.sh /tmp/dd-release/Build/Products/Release-iphoneos/CallCapture.app | tee release-audit.log
      - name: Export screenshots from test results
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls screenshots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-screenshots
          path: |
            screenshots
            screenshots-small
          retention-days: 14
      - name: Compress result bundle
        if: always()
        run: zip -qry TestResults.xcresult.zip TestResults.xcresult || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results
          path: |
            TestResults.xcresult.zip
            app-test.log
            release-build.log
            release-audit.log
            small-screen.log
          retention-days: 7
