name: CI
on:
  push:
    branches: [main, 'phase/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  core-linux:
    name: Core tests (Swift 6.2, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CallCaptureCore
        run: swift test 2>&1 | tee core-linux-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-linux-tests, path: Packages/CallCaptureCore/core-linux-tests.log, retention-days: 7 }

  package-macos:
    name: Package tests + iOS SDK compile (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test (macOS host; media pipeline tests run in the iOS simulator app job)
        working-directory: Packages/CallCaptureCore
        timeout-minutes: 15
        run: |
          set -o pipefail
          # A pseudo-terminal keeps test output line-buffered so a stall is visible in the log.
          script -q /dev/null swift test 2>&1 | tee package-macos-tests.log
      - name: Compile package for iOS 27 device SDK (ScreenCaptureKit engine)
        working-directory: Packages/CallCaptureCore
        run: |
          xcodebuild -scheme CallCaptureCore-Package -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath /tmp/dd-pkg CODE_SIGNING_ALLOWED=NO build 2>&1 | tee package-ios-build.log | grep -E "error|warning: |BUILD" || true
          grep -q "BUILD SUCCEEDED" package-ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-macos-logs
          path: |
            Packages/CallCaptureCore/package-macos-tests.log
            Packages/CallCaptureCore/package-ios-build.log
          retention-days: 7

  app-ios:
    name: App — simulator tests + unsigned Release device build (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rt=[k for k in d if 'iOS-27' in k]
          devs=[x for k in rt for x in d[k] if x['name']=='iPhone 17 Pro'] or [x for k in rt for x in d[k] if 'iPhone' in x['name']]
          print(devs[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Debug simulator build + unit/UI tests
        run: |
          set -o pipefail
          xcodebuild test -collect-test-diagnostics never -project CallCapture.xcodeproj -scheme CallCapture -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult -derivedDataPath /tmp/dd-app CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|✔|✘|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" app-test.log
      - name: Smallest and largest screen layout runs (UX02)
        if: always()
        run: |
          python3 - > devices.txt <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          devs = [x for k in d if 'iOS-27' in k for x in d[k] if 'iPhone' in x['name']]
          small = ['iPhone SE (3rd generation)', 'iPhone 13 mini', 'iPhone 16e', 'iPhone 17e', 'iPhone 16', 'iPhone 17']
          large = ['iPhone 18 Pro Max', 'iPhone 17 Pro Max', 'iPhone 16 Pro Max', 'iPhone 16 Plus']
          pick = lambda pref: sorted(devs, key=lambda x: pref.index(x['name']) if x['name'] in pref else 99)[0]
          for label, dev in (('small', pick(small)), ('large', pick(large))):
              print(label, dev['udid'], dev['name'].replace(' ', '_'))
          PY
          cat devices.txt
          status=0
          while read -r label udid name; do
            xcodebuild test-without-building -collect-test-diagnostics never -retry-tests-on-failure -test-iterations 2 -project CallCapture.xcodeproj -scheme CallCapture               -destination "platform=iOS Simulator,id=$udid" -derivedDataPath /tmp/dd-app -resultBundlePath "Layout-$label.xcresult"               -only-testing:CallCaptureUITests/CallCaptureUITests/testRecordStopAndSave               -only-testing:CallCaptureUITests/CallCaptureUITests/testLargestTextDarkModeKeepsStop               -only-testing:CallCaptureUITests/CallCaptureUITests/testOnboardingAndSetup               > "layout-$label.log" 2>&1 || true
            echo "== $label ($name)"; grep -E "Test Case .* (passed|failed)|TEST (EXECUTE )?(SUCCEEDED|FAILED)" "layout-$label.log"
            mkdir -p "screenshots-$label" && xcrun xcresulttool export attachments --path "Layout-$label.xcresult" --output-path "screenshots-$label" || true
            grep -Eq "TEST (EXECUTE )?SUCCEEDED" "layout-$label.log" || status=1
          done < devices.txt
          exit $status
      - name: Increase Contrast run (UX09)
        if: always()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl ui "$UDID" increase_contrast enabled || echo "increase_contrast not supported by simctl"
          xcodebuild test-without-building -collect-test-diagnostics never -retry-tests-on-failure -test-iterations 2 -project CallCapture.xcodeproj -scheme CallCapture             -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath /tmp/dd-app -resultBundlePath Contrast.xcresult             -only-testing:CallCaptureUITests/CallCaptureUITests/testGapNoticePersistsAfterResume             -only-testing:CallCaptureUITests/CallCaptureUITests/testDarkAppearanceScreens             > contrast.log 2>&1 || true
          xcrun simctl ui "$UDID" increase_contrast disabled || true
          grep -E "Test Case .* (passed|failed)|TEST (EXECUTE )?(SUCCEEDED|FAILED)" contrast.log
          mkdir -p screenshots-contrast && xcrun xcresulttool export attachments --path Contrast.xcresult --output-path screenshots-contrast || true
          grep -Eq "TEST (EXECUTE )?SUCCEEDED" contrast.log
      - name: Unsigned Release build for iOS devices
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project CallCapture.xcodeproj -scheme CallCapture -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath /tmp/dd-release CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee release-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release-build.log
      - name: Release audit (no test doubles, plist, privacy manifest)
        if: always()
        run: bash scripts/release_audit.sh /tmp/dd-release/Build/Products/Release-iphoneos/CallCapture.app | tee release-audit.log
      - name: Export screenshots from test results
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls screenshots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-screenshots
          path: |
            screenshots
            screenshots-small
            screenshots-large
            screenshots-contrast
          retention-days: 14
      - name: Compress result bundle
        if: always()
        run: zip -qry TestResults.xcresult.zip TestResults.xcresult || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results
          path: |
            TestResults.xcresult.zip
            app-test.log
            release-build.log
            release-audit.log
            layout-small.log
            layout-large.log
            contrast.log
          retention-days: 7
