name: Toolchain probe
on:
  push:
    branches: [phase/p00-foundation]
    paths: ['.github/workflows/toolchain-probe.yml']
  workflow_dispatch:
concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Collect SDK interfaces for the P01 symbol table
        run: |
          mkdir -p out
          { sw_vers; xcodebuild -version; xcodebuild -showsdks; xcrun simctl list runtimes; xcrun simctl list devicetypes; swift --version; } > out/toolchain.txt 2>&1
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$SDK/System/Library/Frameworks
          cp -R $F/ScreenCaptureKit.framework/Headers out/SCK-headers
          cp $F/ScreenCaptureKit.framework/Modules/ScreenCaptureKit.swiftmodule/arm64e-apple-ios.swiftinterface out/SCK.swiftinterface
          find $F/_ScreenCaptureKit_SwiftUI.framework -name "*.swiftinterface" | head -1 | xargs -I{} cp {} out/SCK_SwiftUI.swiftinterface || true
          cp -R $F/ReplayKit.framework/Headers out/ReplayKit-headers
          find $F/ActivityKit.framework -name "arm64e-apple-ios.swiftinterface" | head -1 | xargs -I{} cp {} out/ActivityKit.swiftinterface || true
          grep -n "Info.plist\|NSScreenCapture\|UsageDescription\|UIBackgroundModes" -r out/SCK-headers out/SCK.swiftinterface | head -50 > out/plist-hints.txt || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-interfaces-ios27
          path: out
          retention-days: 7
